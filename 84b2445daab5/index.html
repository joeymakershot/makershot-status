<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MakerShot — Reports</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb; --accent:#1f2937; --blue:#1d4ed8; --blue-bg:#eff6ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
  .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; }
  .tab { appearance: none; border: 0; background: none; padding: 9px 16px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .n { margin-left: 6px; font-weight: 500; font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .role { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .rep { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .rep:hover { border-color: #9ca3af; }
  .rep[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  a.pop { color: var(--blue); text-decoration: none; font-size: 12px; }
  a.pop:hover { text-decoration: underline; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .meta { padding: 6px 16px; color: var(--muted); font-size: 12px; }
  iframe { flex: 1; width: 100%; border: 0; min-height: 720px; background: var(--card); }
  .empty { margin: 48px auto; max-width: 440px; text-align: center; color: var(--muted); padding: 0 16px; }
  .empty b { color: var(--ink); display: block; font-size: 15px; margin-bottom: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>MAKERSHOT REPORTS</h1><span class="sub" id="gen"></span></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<div class="bar" id="bar"></div>
<main>
  <div class="meta" id="meta" hidden></div>
  <iframe id="frame" title="Report" hidden></iframe>
  <div class="empty" id="empty" hidden></div>
</main>
<script>
const DATA = {"partners": [{"id": "matt", "name": "Matt", "role": "CEO"}, {"id": "jesse", "name": "Jesse", "role": "CTO"}, {"id": "joey", "name": "Joey", "role": "CFO"}], "reports": [{"id": "inventory-outages", "title": "Inventory Outages", "owner": "jesse", "description": "FBA stock-outs by Master and listing, inbound, dispositions", "order": 1, "path": "../r/inventory-outages/", "updated": "2026-11-07T22:35:15Z"}], "generated": "2026-11-07T22:35:15Z"};
const MEM = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return MEM[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; } },
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const partners = DATA.partners, reports = DATA.reports;
const byOwner = id => reports.filter(r => r.owner === id).sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.title.localeCompare(b.title));
const state = { tab: null, rep: null };

function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) + ' ET';
}
function parseHash() {
  const [t, r] = decodeURIComponent(location.hash.slice(1)).split('/');
  return { t, r };
}
function init() {
  const h = parseHash();
  const saved = store.get('mk.reports.tab');
  const pick = id => partners.find(p => p.id === id) && id;
  state.tab = pick(h.t) || pick(saved) || (partners.find(p => byOwner(p.id).length) || partners[0]).id;
  state.rep = h.r || null;
  $('gen').textContent = DATA.generated ? 'Index updated ' + fmt(DATA.generated) : '';
  render();
}
function render() {
  $('tabs').innerHTML = partners.map(p =>
    `<button class="tab" role="tab" aria-selected="${p.id === state.tab}" data-tab="${esc(p.id)}">${esc(p.name)}<span class="n">${byOwner(p.id).length}</span></button>`).join('');
  const p = partners.find(x => x.id === state.tab);
  const list = byOwner(state.tab);
  if (!list.find(r => r.id === state.rep)) state.rep = list[0]?.id || null;
  $('bar').innerHTML = (p.role ? `<span class="role">${esc(p.name)} · ${esc(p.role)}</span>` : '') +
    list.map(r => `<button class="rep" aria-pressed="${r.id === state.rep}" data-rep="${esc(r.id)}" title="${esc(r.description)}">${esc(r.title)}</button>`).join('') +
    '<span class="spacer"></span>' + (state.rep ? `<a class="pop" id="pop" target="_blank" rel="noopener">Open full page ↗</a>` : '');
  const rep = list.find(r => r.id === state.rep);
  const frame = $('frame'), empty = $('empty'), meta = $('meta');
  if (rep) {
    const src = new URL(rep.path, location.href).href;
    if (frame.dataset.src !== src) { frame.src = src; frame.dataset.src = src; }
    $('pop').href = src;
    frame.hidden = false; empty.hidden = true; meta.hidden = false;
    meta.textContent = [rep.description, rep.updated ? 'Updated ' + fmt(rep.updated) : ''].filter(Boolean).join(' — ');
  } else {
    frame.hidden = true; meta.hidden = true; empty.hidden = false;
    delete frame.dataset.src; frame.removeAttribute('src');
    empty.innerHTML = `<b>No reports yet for ${esc(p.name)}</b>Reports published to this hub with owner “${esc(p.id)}” appear here automatically.`;
  }
  history.replaceState(null, '', '#' + state.tab + (state.rep ? '/' + state.rep : ''));
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'), r = e.target.closest('[data-rep]');
  if (t) { state.tab = t.dataset.tab; state.rep = null; store.set('mk.reports.tab', state.tab); render(); }
  else if (r) { state.rep = r.dataset.rep; render(); }
});
init();
</script>
</body>
</html>
